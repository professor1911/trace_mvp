<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mati Foods</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js"></script>
  <style>
    :root {
      --ink: #16241C;
      --paddy: #3B6E4E;
      --paddy-deep: #254B33;
      --husk: #C79A3D;
      --parchment: #F6F2E6;
      --paper: #FFFDF8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--ink);
      color: var(--paper);
      font-family: 'IBM Plex Sans', sans-serif;
      min-height: 100vh;
    }

    .app {
      max-width: 460px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 26px 24px 14px;
      text-align: center;
    }

    header .brand-logo {
      height: 34px;
      margin-bottom: 10px;
    }

    header .eyebrow {
      font-size: 11px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--husk);
    }

    header h1 {
      font-family: 'Fraunces', serif;
      font-weight: 600;
      font-size: 24px;
      margin: 8px 0 4px;
    }

    header p {
      font-size: 13.5px;
      opacity: .7;
      margin: 0;
    }

    .scan-stage {
      position: relative;
      margin: 16px 24px;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 3/4;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video,
    canvas.preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    canvas.hidden-canvas {
      display: none;
    }

    .frame {
      position: absolute;
      inset: 14%;
      border: 2.5px solid var(--husk);
      border-radius: 16px;
      box-shadow: 0 0 0 999px rgba(0, 0, 0, 0.35);
      pointer-events: none;
    }

    .scan-hint {
      position: absolute;
      bottom: 14px;
      left: 0;
      right: 0;
      text-align: center;
      font-size: 12.5px;
      color: var(--paper);
      opacity: .85;
    }

    .placeholder {
      color: rgba(255, 255, 255, 0.5);
      font-size: 13px;
      text-align: center;
      padding: 0 20px;
    }

    .controls {
      padding: 10px 24px 30px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    button,
    .filebtn {
      font-family: 'IBM Plex Sans', sans-serif;
      font-weight: 600;
      font-size: 14.5px;
      border: none;
      border-radius: 12px;
      padding: 14px;
      cursor: pointer;
      text-align: center;
    }

    .primary {
      background: var(--husk);
      color: var(--paddy-deep);
    }

    .secondary {
      background: rgba(255, 255, 255, 0.08);
      color: var(--paper);
      border: 1px solid rgba(255, 255, 255, 0.18);
    }

    input[type=file] {
      display: none;
    }

    .manual {
      margin-top: 6px;
      display: flex;
      gap: 8px;
    }

    .manual input {
      flex: 1;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.06);
      color: var(--paper);
      padding: 12px;
      font-size: 14px;
    }

    .status {
      text-align: center;
      font-size: 12.5px;
      min-height: 18px;
      color: var(--husk);
    }
  </style>
</head>

<body>
  <div class="app">
    <header>
      <img class="brand-logo" src="logo_name.png" alt="Mati Foods">
      <p class="eyebrow">Mati Foods · Farm-to-Fork Traceability</p>
      <h1>Scan the packet QR</h1>
      <p>Point your camera at the QR code on the packet, or choose a photo of it from your gallery.</p>
    </header>

    <div class="scan-stage" id="stage">
      <p class="placeholder" id="placeholder">Camera preview will appear here once you tap "Use camera"</p>
      <video id="video" playsinline muted style="display:none;"></video>
      <div class="frame" id="frame" style="display:none;"></div>
      <p class="scan-hint" id="hint" style="display:none;">Hold steady — scanning…</p>
    </div>
    <canvas id="canvas" class="hidden-canvas"></canvas>

    <div class="controls">
      <button class="primary" id="cameraBtn">Use camera</button>
      <label class="filebtn secondary" for="fileInput">Choose photo from gallery</label>
      <input type="file" id="fileInput" accept="image/*">
      <div class="manual">
        <input type="text" id="manualInput" placeholder="Or type the QR code, e.g. QR-001-2026">
        <button class="secondary" id="manualGoBtn" style="padding:12px 16px;">Go</button>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    const status = document.getElementById('status');
    const placeholder = document.getElementById('placeholder');
    const frame = document.getElementById('frame');
    const hint = document.getElementById('hint');

    let stream = null;
    let scanning = false;

    function extractQrCode(text) {
      try {
        const url = new URL(text);
        const fromQuery = url.searchParams.get('qr') || url.searchParams.get('batch');
        if (fromQuery) return fromQuery;
        const parts = url.pathname.split('/').filter(Boolean);
        const tIdx = parts.indexOf('t') !== -1 ? parts.indexOf('t') : parts.indexOf('b');
        if (tIdx !== -1 && parts[tIdx + 1]) return decodeURIComponent(parts[tIdx + 1]);
        if (parts.length) return decodeURIComponent(parts[parts.length - 1]);
      } catch (e) {
        // not a URL — treat the raw scanned text as the code itself
      }
      return text.trim();
    }

    function goToBatch(rawText) {
      const qrCode = extractQrCode(rawText);
      status.textContent = `Found: ${qrCode} — opening…`;
      stopCamera();
      window.location.href = `trace.html?qr=${encodeURIComponent(qrCode)}`;
    }

    function stopCamera() {
      scanning = false;
      if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    }

    async function startCamera() {
      status.textContent = '';
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        frame.style.display = 'block';
        hint.style.display = 'block';
        await video.play();
        scanning = true;
        requestAnimationFrame(tick);
      } catch (err) {
        status.textContent = "Couldn't access the camera. Check browser permissions, or use 'Choose photo' instead.";
      }
    }

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          goToBatch(code.data);
          return;
        }
      }
      requestAnimationFrame(tick);
    }

    document.getElementById('cameraBtn').addEventListener('click', startCamera);

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      status.textContent = 'Reading photo…';
      const img = new Image();
      img.onload = () => {
        canvas.width = img.width;
        canvas.height = img.height;
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imageData.data, imageData.width, imageData.height);
        if (code && code.data) {
          goToBatch(code.data);
        } else {
          status.textContent = "Couldn't find a QR code in that photo. Try a clearer, closer shot.";
        }
      };
      img.onerror = () => status.textContent = "Couldn't read that image file.";
      img.src = URL.createObjectURL(file);
    });

    document.getElementById('manualGoBtn').addEventListener('click', () => {
      const val = document.getElementById('manualInput').value.trim();
      if (val) goToBatch(val);
    });
    document.getElementById('manualInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') document.getElementById('manualGoBtn').click();
    });

    window.addEventListener('pagehide', stopCamera);
  </script>
</body>

</html>
