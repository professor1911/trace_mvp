<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Trace — Farm to Pack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16241C;
    --paddy:#3B6E4E;
    --paddy-deep:#254B33;
    --husk:#C79A3D;
    --husk-soft:#E9D9AE;
    --parchment:#F6F2E6;
    --paper:#FFFDF8;
    --soil:#6B4A2F;
    --line:#DCD3BE;
    --ok:#3B6E4E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{ max-width:460px; margin:0 auto; min-height:100vh; background:var(--paper); position:relative; }

  /* ---------- Hero ---------- */
  .hero{
    background:linear-gradient(180deg, var(--paddy-deep) 0%, var(--paddy) 100%);
    color:var(--paper);
    padding:28px 24px 40px;
    position:relative;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(115deg, rgba(255,255,255,0.035) 0 2px, transparent 2px 26px);
    pointer-events:none;
  }
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--husk-soft); opacity:.9; margin:0 0 14px;
  }
  .hero h1{
    font-family:'Fraunces', serif; font-weight:500; font-optical-sizing:auto;
    font-size:clamp(28px,7vw,34px); line-height:1.08; margin:0 0 6px; letter-spacing:-.01em;
  }
  .hero .sub{ font-size:14.5px; opacity:.85; margin:0; max-width:34ch; }
  .farmer-card{
    margin-top:22px; background:rgba(255,255,255,0.08); border:1px solid rgba(255,255,255,0.16);
    border-radius:14px; padding:16px; display:flex; gap:14px; align-items:center; backdrop-filter:blur(2px);
  }
  .farmer-avatar{
    width:54px; height:54px; border-radius:50%; flex:none;
    background:var(--husk); color:var(--paddy-deep); font-family:'Fraunces',serif; font-weight:600; font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  .farmer-meta .name{ font-family:'Fraunces',serif; font-size:17px; font-weight:600; }
  .farmer-meta .loc{ font-size:12.5px; opacity:.82; margin-top:2px; }

  /* ---------- Thread / spine layout ---------- */
  .thread-wrap{ position:relative; padding:8px 24px 100px; }
  .thread-wrap::before{
    content:"";
    position:absolute; left:34px; top:6px; bottom:70px; width:2px;
    background:repeating-linear-gradient(180deg, var(--husk) 0 6px, transparent 6px 11px);
  }
  .stage{ position:relative; padding:22px 0 22px 40px; }
  .stage-node{
    position:absolute; left:0; top:24px; width:20px; height:20px; border-radius:50%;
    background:var(--paper); border:2.5px solid var(--husk);
    display:flex; align-items:center; justify-content:center;
  }
  .stage-node::after{ content:""; width:6px; height:6px; border-radius:50%; background:var(--husk); }
  .stage-label{
    font-family:'IBM Plex Mono', monospace; font-size:10.5px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--soil); margin:0 0 6px; opacity:.75;
  }
  .stage h2{
    font-family:'Fraunces',serif; font-weight:500; font-size:19px; margin:0 0 10px; color:var(--paddy-deep);
  }
  .stage p.story{ font-size:14.5px; line-height:1.6; margin:0 0 10px; color:#3a3630; }

  .pill-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .pill{
    font-size:12.5px; background:var(--husk-soft); color:var(--soil); padding:5px 11px; border-radius:100px;
    font-weight:500;
  }
  .data-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .data-cell{ background:var(--parchment); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .data-cell .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--soil); opacity:.75; }
  .data-cell .v{ font-family:'IBM Plex Mono', monospace; font-size:15px; font-weight:500; margin-top:3px; color:var(--ink); }

  .pass-row{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }
  .pass-chip{ display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:500; background:#EAF2EC; color:var(--ok); border:1px solid #CFE3D4; padding:5px 10px; border-radius:8px; }
  .pass-chip .dot{ width:7px; height:7px; border-radius:50%; background:var(--ok); }

  .carbon-note{ font-size:12px; color:var(--soil); background:#FBF7EC; border:1px dashed var(--husk); border-radius:8px; padding:8px 10px; margin-top:10px; }

  footer.provenance{
    padding:22px 24px 34px; background:var(--ink); color:var(--husk-soft);
  }
  footer.provenance .batch{ font-family:'IBM Plex Mono', monospace; font-size:13px; letter-spacing:.03em; }
  footer.provenance .fine{ font-size:11.5px; opacity:.6; margin-top:10px; line-height:1.5; }

  .not-found{ padding:60px 24px; text-align:center; }
  .not-found h1{ font-family:'Fraunces',serif; font-size:22px; }
  .not-found p{ font-size:14px; color:#665; }

  @media (prefers-reduced-motion: no-preference){
    .stage{ opacity:0; transform:translateY(10px); animation:rise .6s ease forwards; }
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
</style>
</head>
<body>
<div id="app" class="app"></div>
<div id="app" class="app">
  <div class="loading-state">
    <p style="padding:60px 24px;text-align:center;font-family:'IBM Plex Sans',sans-serif;color:#6B4A2F;">Loading this batch's story…</p>
  </div>
</div>

<!-- config.js sets window.API_BASE_URL — the only file you edit per environment -->
<script src="config.js"></script>

<script>
(async function(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const batchId = params.get('batch');

  if(!batchId){
    app.innerHTML = `
      <div class="not-found">
        <h1>No batch code found</h1>
        <p>This page is meant to be opened by scanning a QR code on a rice packet. If you typed this link manually, add ?batch=YOUR_BATCH_ID to the URL.</p>
      </div>`;
    return;
  }

  let record;
  try{
    const res = await fetch(`${window.API_BASE_URL}/api/batches/${encodeURIComponent(batchId)}/consumer`);
    if(res.status === 404){
      app.innerHTML = `
        <div class="not-found">
          <h1>We couldn't find that batch</h1>
          <p>This code may be unregistered, mistyped, or has been withdrawn. If you scanned this from a packet, please contact the retailer where you purchased it.</p>
        </div>`;
      return;
    }
    if(!res.ok) throw new Error(`API error: ${res.status}`);
    record = await res.json();
  }catch(err){
    app.innerHTML = `
      <div class="not-found">
        <h1>Couldn't load this batch right now</h1>
        <p>There may be a connection issue. Please try scanning again in a moment.</p>
      </div>`;
    return;
  }

  const initials = record.farmer.name.split(' ').map(w=>w[0]).slice(0,2).join('');
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '—';

  app.innerHTML = `

  if(!record){
    app.innerHTML = <div class="not-found">
        <h1>We couldn't find that batch</h1>
        <p>This code may be unregistered, mistyped, or has been withdrawn. If you scanned this from a packet, please contact the retailer where you purchased it.</p>
      </div>;
    return;
  }

  const initials = record.farmer.name.split(' ').map(w=>w[0]).slice(0,2).join('');
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '—';

  app.innerHTML = 
    <section class="hero">
      <p class="eyebrow">Batch ${record.batch_id} · ${record.product_name}</p>
      <h1>Grown by ${record.farmer.name.split(' ')[0]}, milled and packed for you</h1>
      <p class="sub">Every stage of this rice's journey — field to pack — verified and on record.</p>
      <div class="farmer-card">
        <div class="farmer-avatar">${initials}</div>
        <div class="farmer-meta">
          <div class="name">${record.farmer.name}</div>
          <div class="loc">${record.farmer.village}, ${record.farmer.district}, ${record.farmer.state}</div>
        </div>
      </div>
    </section>

    <div class="thread-wrap">

      <div class="stage" style="animation-delay:.02s">
        <div class="stage-node"></div>
        <p class="stage-label">01 · The farmer</p>
        <h2>${record.farmer.experience_years ? Math.round(record.farmer.experience_years) + ' years farming' : 'The story so far'}</h2>
        <p class="story">${record.farmer.story || ''}</p>
        <div class="pill-row">
          ${record.farmer.fpo ? `<span class="pill">${record.farmer.fpo}</span>` : ''}
          ${record.farmer.certification ? `<span class="pill">${record.farmer.certification}</span>` : ''}
        </div>
      </div>

      <div class="stage" style="animation-delay:.08s">
        <div class="stage-node"></div>
        <p class="stage-label">02 · The field</p>
        <h2>${record.farm.area_acres ? record.farm.area_acres + ' acres' : 'The plot'} of ${record.farm.soil_type || 'farmland'}</h2>
        <div class="data-grid">
          <div class="data-cell"><div class="k">Irrigation</div><div class="v">${record.farm.irrigation || '—'}</div></div>
          <div class="data-cell"><div class="k">Organic since</div><div class="v">${fmtDate(record.farm.organic_since)}</div></div>
        </div>
      </div>

      <div class="stage" style="animation-delay:.14s">
        <div class="stage-node"></div>
        <p class="stage-label">03 · The crop</p>
        <h2>${record.crop.crop} — ${record.crop.variety}</h2>
        <div class="data-grid">
          <div class="data-cell"><div class="k">Season</div><div class="v">${record.crop.season || '—'}</div></div>
          <div class="data-cell"><div class="k">Sown</div><div class="v">${fmtDate(record.crop.sowing_date)}</div></div>
          <div class="data-cell"><div class="k">Harvested</div><div class="v">${fmtDate(record.crop.harvest_date)}</div></div>
          <div class="data-cell"><div class="k">Method</div><div class="v">${record.harvest_summary.method || '—'}</div></div>
        </div>
      </div>

      <div class="stage" style="animation-delay:.20s">
        <div class="stage-node"></div>
        <p class="stage-label">04 · Milling &amp; grading</p>
        <h2>Graded ${record.processing_summary.grading || '—'}</h2>
        <div class="data-grid">
          <div class="data-cell"><div class="k">Recovery rate</div><div class="v">${record.processing_summary.recovery_pct ? Math.round(record.processing_summary.recovery_pct*100)+'%' : '—'}</div></div>
          <div class="data-cell"><div class="k">Yield (this plot)</div><div class="v">${record.harvest_summary.yield_kg ? record.harvest_summary.yield_kg+' kg' : '—'}</div></div>
        </div>
      </div>

      <div class="stage" style="animation-delay:.26s">
        <div class="stage-node"></div>
        <p class="stage-label">05 · Lab-verified</p>
        <h2>Nutrition &amp; safety</h2>
        <div class="data-grid">
          <div class="data-cell"><div class="k">Protein</div><div class="v">${record.nutrition_and_safety.protein ?? '—'} g</div></div>
          <div class="data-cell"><div class="k">Iron</div><div class="v">${record.nutrition_and_safety.iron ?? '—'} mg</div></div>
          <div class="data-cell"><div class="k">Calcium</div><div class="v">${record.nutrition_and_safety.calcium ?? '—'} mg</div></div>
          <div class="data-cell"><div class="k">Fibre</div><div class="v">${record.nutrition_and_safety.fiber ?? '—'} g</div></div>
        </div>
        <div class="pass-row">
          <div class="pass-chip"><span class="dot"></span>Heavy metals: ${record.nutrition_and_safety.heavy_metals || '—'}</div>
          <div class="pass-chip"><span class="dot"></span>Pesticides: ${record.nutrition_and_safety.pesticides || '—'}</div>
          <div class="pass-chip"><span class="dot"></span>Microbiology: ${record.nutrition_and_safety.microbiology || '—'}</div>
        </div>
      </div>

      <div class="stage" style="animation-delay:.32s">
        <div class="stage-node"></div>
        <p class="stage-label">06 · Impact</p>
        <h2>Farming practice, in numbers</h2>
        <div class="data-grid">
          <div class="data-cell"><div class="k">Water retention</div><div class="v">${record.sustainability.water_retention || '—'}</div></div>
          <div class="data-cell"><div class="k">Biodiversity</div><div class="v">${record.sustainability.biodiversity || '—'}</div></div>
        </div>
        ${record.sustainability.basalt_erw_applied === 'YES' ? `<div class="carbon-note">Enhanced rock weathering applied on this plot. CO₂ removal: ${record.sustainability.co2_removal || 'pending verification'} — estimated, pending third-party MRV verification.</div>` : ''}
      </div>

    </div>

    <footer class="provenance">
      <div class="batch">BATCH ${record.batch_id} &nbsp;·&nbsp; PACKED ${fmtDate(record.pack_date)} &nbsp;·&nbsp; BEST BEFORE ${fmtDate(record.expiry)}</div>
      <div class="fine">This page reflects records logged by field staff and lab partners for this specific batch. Location shown at village/district level only. Report a concern about this batch to the retailer where it was purchased.</div>
    </footer>
  `;
})();
</script>
</body>
</html>
