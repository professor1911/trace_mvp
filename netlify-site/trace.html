<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rice Trace — Farm to Pack</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root{
    --ink:#16241C; --paddy:#3B6E4E; --paddy-deep:#254B33; --husk:#C79A3D; --husk-soft:#E9D9AE;
    --parchment:#F6F2E6; --paper:#FFFDF8; --soil:#6B4A2F; --line:#DCD3BE;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{ background:var(--parchment); color:var(--ink); font-family:'IBM Plex Sans', sans-serif; -webkit-font-smoothing:antialiased; }
  .app{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--paper); }
  a.scan-link{ color:inherit; }

  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px; background:var(--ink); color:var(--husk-soft); }
  .topbar .brand{ font-family:'Fraunces',serif; font-weight:600; font-size:15px; color:var(--paper); }
  .topbar a{ font-size:12.5px; text-decoration:none; color:var(--husk); border:1px solid rgba(199,154,61,0.5); padding:6px 12px; border-radius:100px; }

  .hero{ background:linear-gradient(180deg, var(--paddy-deep) 0%, var(--paddy) 100%); color:var(--paper); padding:22px 22px 20px; }
  .eyebrow{ font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--husk-soft); opacity:.9; margin:0 0 8px; }
  .hero h1{ font-family:'Fraunces', serif; font-weight:500; font-size:clamp(22px,6vw,26px); line-height:1.15; margin:0; letter-spacing:-.01em; }

  .section{ padding:22px 20px; border-bottom:1px solid var(--line); }
  .section h2{ font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:0 0 4px; color:var(--paddy-deep); }
  .section .section-sub{ font-size:12.5px; color:var(--soil); opacity:.8; margin:0 0 16px; }

  .profile-card{ display:flex; gap:16px; align-items:flex-start; }
  .avatar{ width:84px; height:84px; border-radius:16px; flex:none; object-fit:cover; background:var(--husk-soft); }
  .avatar-fallback{
    width:84px; height:84px; border-radius:16px; flex:none; background:var(--husk); color:var(--paddy-deep);
    display:flex; align-items:center; justify-content:center; font-family:'Fraunces',serif; font-weight:600; font-size:28px;
  }
  .profile-meta .name{ font-family:'Fraunces',serif; font-weight:600; font-size:19px; }
  .profile-meta .loc{ font-size:13px; color:var(--soil); margin-top:2px; }
  .profile-story{ font-size:14px; line-height:1.6; margin-top:14px; color:#3a3630; }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .chip{ font-size:12px; background:var(--husk-soft); color:var(--soil); padding:5px 11px; border-radius:100px; font-weight:500; }
  .kv-list{ margin-top:14px; display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .kv{ background:var(--parchment); border:1px solid var(--line); border-radius:10px; padding:9px 11px; }
  .kv .k{ font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--soil); opacity:.75; }
  .kv .v{ font-size:13.5px; font-weight:500; margin-top:2px; }

  .plot-tabs{ display:flex; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  .plot-tab{ font-size:12.5px; padding:6px 12px; border-radius:100px; border:1px solid var(--line); background:var(--paper); cursor:pointer; font-weight:500; }
  .plot-tab.active{ background:var(--paddy); color:var(--paper); border-color:var(--paddy); }
  #map{ height:220px; border-radius:14px; border:1px solid var(--line); background:var(--parchment); }
  .map-empty{ height:220px; border-radius:14px; border:1px dashed var(--line); background:var(--parchment); display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; font-size:12.5px; color:var(--soil); }
  .plot-detail{ margin-top:14px; }

  .disclosure-block{ margin-bottom:18px; }
  .disclosure-block h3{ font-family:'IBM Plex Mono',monospace; font-size:11.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--soil); margin:0 0 8px; padding-bottom:6px; border-bottom:1px solid var(--line); }
  .field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .field-grid .kv .v{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; word-break:break-word; }
  .record-row{ background:var(--parchment); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:12.5px; }
  .record-row .rk{ color:var(--soil); }

  footer.provenance{ padding:20px; background:var(--ink); color:var(--husk-soft); }
  footer.provenance .batch{ font-family:'IBM Plex Mono', monospace; font-size:12.5px; }
  footer.provenance .fine{ font-size:11px; opacity:.6; margin-top:8px; line-height:1.5; }

  .not-found, .loading-msg{ padding:60px 24px; text-align:center; }
  .not-found h1{ font-family:'Fraunces',serif; font-size:22px; }
  .not-found p, .loading-msg p{ font-size:14px; color:#665; }
</style>
</head>
<body>
<div id="app" class="app">
  <div class="loading-msg"><p>Loading this batch's story…</p></div>
</div>

<script src="config.js"></script>
<script>
(async function(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const batchId = params.get('batch');

  if(!batchId){
    app.innerHTML = `<div class="not-found"><h1>No batch code found</h1><p>Open this page by scanning a packet's QR code, or <a class="scan-link" href="scan.html">scan one now</a>.</p></div>`;
    return;
  }

  let record;
  try{
    const res = await fetch(`${window.API_BASE_URL}/api/batches/${encodeURIComponent(batchId)}/consumer`);
    if(res.status === 404){
      app.innerHTML = `<div class="not-found"><h1>We couldn't find that batch</h1><p>This code may be unregistered, mistyped, or has been withdrawn. If you scanned this from a packet, please contact the retailer where you purchased it.</p></div>`;
      return;
    }
    if(!res.ok) throw new Error('API error: ' + res.status);
    record = await res.json();
  }catch(err){
    app.innerHTML = `<div class="not-found"><h1>Couldn't load this batch right now</h1><p>There may be a connection issue. Please try scanning again in a moment.</p></div>`;
    return;
  }

  const fp = record.farmer_profile || {};
  const plots = record.farm_plots || [];
  const disclosure = record.full_disclosure || [];
  const fmtDate = d => d ? new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'}) : '—';
  const initials = (fp.name || '?').split(' ').map(w=>w[0]).slice(0,2).join('');

  const avatarHtml = fp.photo_url
    ? `<img class="avatar" src="${fp.photo_url}" alt="${fp.name || 'Farmer'}">`
    : `<div class="avatar-fallback">${initials}</div>`;

  const certChips = (fp.certifications || []).map(c => `<span class="chip">${c}</span>`).join('');
  const fpoChip = fp.fpo ? `<span class="chip">${fp.fpo}</span>` : '';
  const icsChip = fp.ics_group ? `<span class="chip">${fp.ics_group}</span>` : '';

  const section1 = `
    <section class="section">
      <h2>Farmer</h2>
      <div class="profile-card">
        ${avatarHtml}
        <div class="profile-meta">
          <div class="name">${fp.name || 'Unnamed farmer'}</div>
          <div class="loc">${[fp.village, fp.district, fp.state].filter(Boolean).join(', ')}</div>
        </div>
      </div>
      ${fp.story ? `<p class="profile-story">${fp.story}</p>` : ''}
      <div class="chip-row">${icsChip}${fpoChip}${certChips}</div>
      <div class="kv-list">
        <div class="kv"><div class="k">Experience</div><div class="v">${fp.experience_years ? Math.round(fp.experience_years) + ' years' : '—'}</div></div>
        <div class="kv"><div class="k">Training attended</div><div class="v">${fp.training_attended || '—'}</div></div>
      </div>
    </section>`;

  let plotTabsHtml = '';
  if(plots.length > 1){
    plotTabsHtml = `<div class="plot-tabs">` + plots.map((p,i) =>
      `<div class="plot-tab ${i===0?'active':''}" data-plot-idx="${i}">Plot ${p.plot_id ?? i+1}</div>`
    ).join('') + `</div>`;
  }

  const hasAnyGeo = plots.some(p => p.centroid || p.geo_boundary);
  const mapHtml = hasAnyGeo
    ? `<div id="map"></div>`
    : `<div class="map-empty">GPS location for this plot hasn't been recorded yet. Once field staff upload it, the boundary will appear here.</div>`;

  function plotDetailHtml(p){
    if(!p) return '';
    return `
      <div class="kv-list">
        <div class="kv"><div class="k">Area</div><div class="v">${p.area_acres ? p.area_acres + ' acres' : '—'}</div></div>
        <div class="kv"><div class="k">Soil type</div><div class="v">${p.soil_type || '—'}</div></div>
        <div class="kv"><div class="k">Irrigation</div><div class="v">${p.irrigation || '—'}</div></div>
        <div class="kv"><div class="k">Water source</div><div class="v">${p.water_source || '—'}</div></div>
        <div class="kv"><div class="k">Survey no.</div><div class="v">${p.survey_no || '—'}</div></div>
        <div class="kv"><div class="k">Organic since</div><div class="v">${fmtDate(p.organic_since)}</div></div>
      </div>`;
  }

  const section2 = `
    <section class="section">
      <h2>Farm plot</h2>
      <p class="section-sub">${plots.length > 1 ? plots.length + ' plots linked to this batch — tap to switch.' : 'Location and land details for this plot.'}</p>
      ${plotTabsHtml}
      ${mapHtml}
      <div class="plot-detail" id="plotDetail">${plotDetailHtml(plots[0])}</div>
    </section>`;

  function renderFields(fields){
    return `<div class="field-grid">` + Object.entries(fields || {}).map(([k,v]) =>
      `<div class="kv"><div class="k">${k}</div><div class="v">${v === null || v === '' ? '—' : v}</div></div>`
    ).join('') + `</div>`;
  }
  function renderRecords(records){
    return (records || []).map(rec =>
      `<div class="record-row">` + Object.entries(rec).map(([k,v]) =>
        `<span class="rk">${k}:</span> ${v === null || v === '' ? '—' : v} &nbsp; `
      ).join('') + `</div>`
    ).join('');
  }
  const disclosureHtml = disclosure.map(block => `
    <div class="disclosure-block">
      <h3>${block.title}</h3>
      ${block.fields ? renderFields(block.fields) : ''}
      ${block.records ? renderRecords(block.records) : ''}
    </div>`).join('');

  const section3 = `
    <section class="section" style="border-bottom:none;">
      <h2>Full record</h2>
      <p class="section-sub">Everything logged for this batch, field to pack. Personal contact and banking details are never shown here.</p>
      ${disclosureHtml || '<p class="section-sub">No further records available for this batch.</p>'}
    </section>`;

  app.innerHTML = `
    <div class="topbar">
      <span class="brand">Rice Trace</span>
      <a class="scan-link" href="scan.html">Scan another</a>
    </div>
    <section class="hero">
      <p class="eyebrow">Batch ${record.batch_id} · ${record.product_name || ''}</p>
      <h1>Field to pack — the full story of this rice</h1>
    </section>
    ${section1}
    ${section2}
    ${section3}
    <footer class="provenance">
      <div class="batch">BATCH ${record.batch_id} &nbsp;·&nbsp; PACKED ${fmtDate(record.pack_date)} &nbsp;·&nbsp; BEST BEFORE ${fmtDate(record.expiry)}</div>
      <div class="fine">Personal contact numbers, age, gender, and banking details are never shown on this page. Report a concern to the retailer where this was purchased.</div>
    </footer>
  `;

  if(hasAnyGeo && window.L){
    const map = L.map('map', { zoomControl: false, attributionControl: false });
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    const layers = [];

    function drawPlot(idx){
      layers.forEach(l => map.removeLayer(l));
      layers.length = 0;
      const p = plots[idx];
      if(!p) return;
      if(p.geo_boundary){
        const layer = L.geoJSON(p.geo_boundary, { style: { color: '#3B6E4E', weight: 2, fillColor: '#C79A3D', fillOpacity: 0.25 } }).addTo(map);
        layers.push(layer);
        map.fitBounds(layer.getBounds(), { padding: [20,20] });
      } else if(p.centroid && p.centroid.lat && p.centroid.lng){
        const marker = L.marker([p.centroid.lat, p.centroid.lng]).addTo(map);
        layers.push(marker);
        map.setView([p.centroid.lat, p.centroid.lng], 15);
      }
    }

    drawPlot(0);

    document.querySelectorAll('.plot-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.plot-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const idx = parseInt(tab.dataset.plotIdx, 10);
        drawPlot(idx);
        document.getElementById('plotDetail').innerHTML = plotDetailHtml(plots[idx]);
      });
    });
  }
})();
</script>
</body>
</html>
