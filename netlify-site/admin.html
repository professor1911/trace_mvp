<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin - Upload Shapefile</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink:#16241C; --paddy:#3B6E4E; --paper:#FFFDF8; --line:#DCD3BE; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--paper); color: var(--ink); margin: 0; padding: 40px 20px; }
  .container { max-width: 500px; margin: 0 auto; }
  h1 { font-weight: 600; margin-bottom: 24px; color: var(--paddy); }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-weight: 500; margin-bottom: 6px; font-size: 14px; }
  input[type="text"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid var(--line); border-radius: 6px; box-sizing: border-box; }
  input[type="file"] { margin-top: 6px; }
  button { background: var(--paddy); color: white; border: none; padding: 12px 20px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px; }
  button:hover { opacity: 0.9; }
  .status { margin-top: 20px; padding: 12px; border-radius: 6px; display: none; }
  .status.success { background: #e6f4ea; color: #137333; display: block; }
  .status.error { background: #fce8e6; color: #c5221f; display: block; }
</style>
</head>
<body>
<div class="container">
  <h1>Upload Plot Shapefile (KML)</h1>
  <form id="uploadForm">
    <div class="form-group">
      <label for="adminKey">Admin API Key</label>
      <input type="password" id="adminKey" required placeholder="Enter admin password">
    </div>
    <div class="form-group">
      <label for="batchId">Batch ID</label>
      <input type="text" id="batchId" required placeholder="e.g. BATCH-2026-001">
    </div>
    <div class="form-group">
      <label for="plotId">Plot ID</label>
      <input type="text" id="plotId" required placeholder="e.g. P1 or 1">
    </div>
    <div class="form-group">
      <label for="kmlFile">KML File</label>
      <input type="file" id="kmlFile" accept=".kml" required>
    </div>
    <button type="submit" id="submitBtn">Upload Boundary</button>
  </form>
  <div id="status" class="status"></div>
</div>

<script src="config.js"></script>
<script>
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const submitBtn = document.getElementById('submitBtn');
  const statusEl = document.getElementById('status');
  
  const adminKey = document.getElementById('adminKey').value.trim();
  const batchId = document.getElementById('batchId').value.trim();
  const plotId = document.getElementById('plotId').value.trim();
  const kmlFile = document.getElementById('kmlFile').files[0];
  
  if (!kmlFile) return;

  submitBtn.disabled = true;
  submitBtn.textContent = 'Uploading...';
  statusEl.className = 'status';
  statusEl.textContent = '';

  const formData = new FormData();
  formData.append('kml', kmlFile);

  try {
    const url = `${window.API_BASE_URL}/api/batches/${encodeURIComponent(batchId)}/plots/${encodeURIComponent(plotId)}/boundary`;
    const res = await fetch(url, {
      method: 'POST',
      headers: {
        'x-admin-key': adminKey
      },
      body: formData
    });

    const data = await res.json();

    if (res.ok) {
      statusEl.className = 'status success';
      statusEl.textContent = `Success! Plot boundary updated for Plot ID ${data.plot_id}.`;
      document.getElementById('uploadForm').reset();
    } else {
      statusEl.className = 'status error';
      statusEl.textContent = `Error: ${data.error || 'Upload failed'}`;
    }
  } catch (err) {
    statusEl.className = 'status error';
    statusEl.textContent = 'A network error occurred while uploading.';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'Upload Boundary';
  }
});
</script>
</body>
</html>
