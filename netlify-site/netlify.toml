[build]
  publish = "."

# Makes https://yoursite.netlify.app/t/QR-001-2026 work — this is the URL
# baked into every generated QR code (see backend/utils/generateQR.js).
[[redirects]]
  from = "/t/*"
  to = "/trace.html?qr=:splat"
  status = 200

# Old codes printed before the QR-first cutover still worked via ?batch=;
# keep the redirect so any already-printed packets don't 404.
[[redirects]]
  from = "/b/*"
  to = "/trace.html?qr=:splat"
  status = 200
